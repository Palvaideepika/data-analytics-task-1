name: Data Analytics Task 1 Deployment

on:
  push:
    branches:
      - main

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python script
        run: |
          python -m py_compile main.py

      - name: Deployment validation complete
        run: |
          echo "Data Analytics Task 1 deployment validation completed successfully."
